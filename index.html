<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 Birthday + Personality AI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --card-border: #d9e1ec;
        --accent-gold: #f4b942;
        --accent-rose: #e86b7b;
        --accent-cyan: #2b9c9c;
        --text-primary: #1e2b3a;
        --text-secondary: #4f5d73;
        --text-muted: #7b8ba0;
        --rank-bg: #eaeef3;
        --pill-bg: #e1f0f0;
        --border-light: #d0dbe8;
        --shadow: 0 6px 14px rgba(0, 10, 20, 0.05);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(1.5px 1.5px at 18% 32%, #a0b8d0 15%, transparent 80%),
          radial-gradient(1.2px 1.2px at 73% 56%, #b7cadf 15%, transparent 80%),
          radial-gradient(1px 1px at 40% 85%, #c0d0e0 20%, transparent 90%);
        opacity: 0.3;
        pointer-events: none;
        z-index: 0;
      }

      header {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 2.2rem 1.5rem 1.5rem;
      }

      header h1 {
        font-weight: 800;
        font-size: clamp(2.2rem, 6vw, 3.8rem);
        color: #1e3b4f;
        letter-spacing: -1px;
        line-height: 1.2;
      }

      header p {
        color: var(--text-secondary);
        margin-top: 0.6rem;
        font-size: 0.95rem;
      }

      .today-badge {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.4rem 1.2rem;
        border-radius: 30px;
        background: #e3ecf5;
        color: #1f4a6e;
        font-weight: 500;
        font-size: 0.8rem;
        border: 1px solid #b9cfec;
      }

      .container {
        position: relative;
        z-index: 2;
        max-width: 880px;
        margin: 0 auto;
        padding: 1.2rem 1rem 4rem;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 1.2rem 1.6rem;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 1.2rem;
        align-items: center;
        cursor: pointer;
        box-shadow: var(--shadow);
        transition: all 0.2s ease;
        animation: slideUp 0.35s ease backwards;
      }

      .card:hover {
        transform: translateY(-2px);
        border-color: #c0d0e6;
        box-shadow: 0 12px 24px rgba(0, 20, 30, 0.08);
      }

      .card.today {
        background: #fff9ef;
        border-left: 6px solid var(--accent-gold);
      }

      .card.soon {
        border-left: 4px solid var(--accent-rose);
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .rank {
        width: 2.8rem;
        height: 2.8rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 1.1rem;
        background: var(--rank-bg);
        color: #235278;
        border: 1px solid #b9cee8;
        flex-shrink: 0;
      }

      .card.today .rank {
        background: var(--accent-gold);
        color: #2b2b2b;
        border: none;
        font-size: 1.5rem;
      }

      .info {
        min-width: 0;
      }

      .name {
        font-weight: 700;
        font-size: 1.2rem;
        color: #1d3647;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        margin-top: 0.25rem;
      }

      .meta span {
        font-size: 0.8rem;
        color: var(--text-secondary);
      }

      .pill-day {
        display: inline-block;
        background: var(--pill-bg);
        color: #1c6d6d;
        border: 1px solid #b2d8d8;
        border-radius: 30px;
        padding: 0.2rem 0.9rem;
        font-size: 0.7rem;
        font-weight: 500;
        margin-top: 0.35rem;
      }

      .live-timer {
        font-size: 0.7rem;
        color: var(--accent-rose);
        margin-top: 0.4rem;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
      }

      .countdown {
        text-align: center;
        min-width: 75px;
      }

      .days-num {
        font-weight: 800;
        font-size: 2.2rem;
        line-height: 1;
        color: #1f5f8f;
      }

      .card.today .days-num {
        color: #c9822b;
        font-size: 1.9rem;
      }

      .days-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        margin-top: 0.15rem;
      }

      .progress-wrap {
        margin-top: 0.7rem;
        height: 4px;
        background: #e2e9f0;
        border-radius: 3px;
      }

      .progress-bar {
        height: 100%;
        background: #3f9eb5;
        border-radius: 3px;
      }

      .confetti-row {
        font-size: 1.3rem;
        letter-spacing: 0.2rem;
        margin-top: 0.3rem;
        animation: bounce 1.2s infinite alternate;
      }

      @keyframes bounce {
        0% {
          transform: translateY(0);
        }
        100% {
          transform: translateY(-3px);
        }
      }

      /* MODAL */
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 2000;
        background: rgba(10, 25, 40, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }

      .modal-overlay.open {
        opacity: 1;
        pointer-events: all;
      }

      .modal {
        background: #ffffff;
        border-radius: 32px;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 20px 40px rgba(0, 15, 30, 0.15);
        transform: scale(0.96) translateY(10px);
        transition: transform 0.25s ease-out;
        max-height: 90vh;
        overflow-y: auto;
        border: 1px solid #cfddee;
      }

      .modal-overlay.open .modal {
        transform: scale(1) translateY(0);
      }

      .modal-header {
        padding: 2rem 1.8rem 1.2rem;
        text-align: center;
        background: #f9fcff;
        border-bottom: 1px solid #dbe6f0;
      }

      .modal-header.is-today {
        background: #fff6e6;
      }

      .modal-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        font-size: 2.8rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1rem;
        background: #e1eefc;
        border: 2px solid #b6d2ed;
      }

      .modal-name {
        font-weight: 700;
        font-size: 1.8rem;
        color: #11354e;
      }

      .modal-status {
        margin-top: 0.4rem;
        font-size: 0.85rem;
        color: var(--text-secondary);
      }

      .modal-status.celebrating {
        color: #d2842b;
        font-weight: 600;
      }

      .modal-timer-section {
        padding: 1.2rem 1.8rem;
        background: #ffffff;
        border-bottom: 1px solid #e0ecf5;
      }

      .modal-timer-row {
        display: flex;
        justify-content: center;
        gap: 0.5rem;
      }

      .timer-box {
        flex: 1;
        max-width: 75px;
        background: #f2f7fd;
        border: 1px solid #cbdae9;
        border-radius: 16px;
        padding: 0.8rem 0.2rem;
        text-align: center;
      }

      .timer-box .val {
        font-weight: 800;
        font-size: 1.8rem;
        color: #1b5f8c;
        line-height: 1;
      }

      .timer-box .lbl {
        font-size: 0.6rem;
        color: #7e95aa;
        margin-top: 0.2rem;
      }

      .modal-details {
        padding: 1rem 1.8rem 2rem;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 0.7rem 0;
        border-bottom: 1px solid #e6eef8;
        gap: 1rem;
      }

      .detail-row:last-child {
        border-bottom: none;
      }

      .detail-label {
        font-size: 0.8rem;
        color: #617e9a;
        font-weight: 500;
        min-width: 95px;
      }

      .detail-value {
        font-weight: 500;
        font-size: 0.85rem;
        color: #1f3f57;
        text-align: right;
        flex: 1;
      }

      .zodiac-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        background: #e4f0f5;
        color: #166b7a;
        border: 1px solid #b1d7e8;
        border-radius: 40px;
        padding: 0.2rem 0.9rem;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
      }

      .modal-close {
        position: sticky;
        top: 0.5rem;
        left: calc(100% - 3rem);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: #eef3f9;
        border: 1px solid #c6d8ec;
        color: #3e617c;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-left: auto;
        margin-right: 1rem;
        z-index: 10;
      }

      @media (max-width: 500px) {
        .card {
          grid-template-columns: auto 1fr;
        }
        .countdown {
          display: none;
        }
        .detail-label {
          min-width: 70px;
        }
      }

      .personality-section {
        background: #fafdfe;
        margin-top: 0.8rem;
        border-radius: 20px;
        padding: 0.8rem 1rem;
      }

      .personality-title {
        font-weight: 700;
        font-size: 0.9rem;
        color: #2b6f7a;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        gap: 0.3rem;
      }

      .personality-points {
        padding-left: 1.2rem;
        font-size: 0.8rem;
        color: #345f6e;
        list-style-type: none;
      }

      .personality-points li {
        margin-bottom: 0.4rem;
        display: flex;
        gap: 0.4rem;
      }

      .personality-points li::before {
        content: "✨";
        color: var(--accent-gold);
      }

      .vibes-text {
        font-style: italic;
        background: #eff7fa;
        padding: 0.5rem 1rem;
        border-radius: 20px;
        margin-top: 0.5rem;
        font-size: 0.75rem;
        color: #2a7f7f;
      }

      .alert {
        font-size: 10px;
        color: #ad2b2b;
        text-align: center;
        padding: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎂 Birthday + Personality AI</h1>
      <div class="today-badge" id="todayLabel">—</div>
    </header>

    <div class="container" id="cards"></div>

    <!-- MODAL PERSONALITY -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalBg(event)">
      <div class="modal" id="modal">
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
        <div class="modal-header" id="mHeader">
          <div class="modal-avatar" id="mAvatar">🎂</div>
          <div class="modal-name" id="mName">—</div>
          <div class="modal-status" id="mStatus">—</div>
        </div>
        <div class="modal-timer-section" id="mTimerSection">
          <div class="modal-timer-label" id="mTimerLabel">Hitung Mundur</div>
          <div class="modal-timer-row" id="mTimerRow">
            <div class="timer-box">
              <div class="val" id="tDays">00</div>
              <div class="lbl">Hari</div>
            </div>
            <div class="timer-box">
              <div class="val" id="tHours">00</div>
              <div class="lbl">Jam</div>
            </div>
            <div class="timer-box">
              <div class="val" id="tMins">00</div>
              <div class="lbl">Menit</div>
            </div>
            <div class="timer-box">
              <div class="val" id="tSecs">00</div>
              <div class="lbl">Detik</div>
            </div>
          </div>
        </div>
        <div class="modal-details" id="mDetails"></div>
        <div id="personalityContainer" style="padding: 0 1.8rem 1.5rem"></div>
        <p class="alert">
          ✨ Hasil dari API sifat — jangan dianggap serius, cuma seru-seruan ✨
        </p>
      </div>
    </div>

    <!-- MODAL ZODIAK -->
    <div
      class="modal-overlay"
      id="zodiacOverlay"
      onclick="closeZodiacBg(event)"
    >
      <div class="modal" style="max-width: 400px">
        <button class="modal-close" onclick="closeZodiac()">✕</button>
        <div class="modal-header">
          <div class="modal-avatar" id="zAvatar">♈</div>
          <div class="modal-name" id="zName">Aries</div>
          <div class="modal-status" id="zElement">Elemen Api</div>
        </div>
        <div class="modal-details" id="zDetails"></div>
        <p class="alert">Jangan dianggap serius, cuma buat seruan aja</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
